name: Sync Fork
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3_openjdk
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - name: Sync
        run: |
          git remote add upstream https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/MojoLauncher/MojoLauncher.git
          git fetch upstream v3_openjdk
          git config user.name "bot"
          git config user.email "bot@adriyache32.github.io"
          git merge upstream/v3_openjdk --no-edit
          git push origin v3_openjdk
          echo "✅ Synced"
