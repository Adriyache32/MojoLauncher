name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "MojoLauncher/MojoLauncher"
          source_branch: "v3_openjdk"
          destination_branch: "v3_openjdk"
          github_token: ${{ secrets.GITHUB_TOKEN }}
