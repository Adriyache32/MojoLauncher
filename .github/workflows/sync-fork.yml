name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v3_openjdk
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/MojoLauncher/MojoLauncher.git
          git fetch upstream
          git merge upstream/v3_openjdk --no-edit || echo "Already up to date"

      - name: Push
        run: git push origin v3_openjdk
